name: Build iPhone app (unsigned IPA for Sideloadly)

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Stamp build number into the app (shown first in the debug log)
        run: echo "export const BUILD = 'build-${{ github.run_number }} ${GITHUB_SHA::7}';" > src/buildInfo.ts

      - name: Download Vosk model (English small, bundled into the app)
        run: |
          curl -L --fail --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/vosk-model.zip" https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          SIZE=$(stat -f%z "$RUNNER_TEMP/vosk-model.zip")
          echo "model zip size: $SIZE"
          test "$SIZE" = "41205931"
          unzip -q "$RUNNER_TEMP/vosk-model.zip" -d "$RUNNER_TEMP/vosk"
          mkdir -p assets
          mv "$RUNNER_TEMP/vosk/vosk-model-small-en-us-0.15" assets/model-en-us
          ls assets/model-en-us assets/model-en-us/graph

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: app/ios
        run: pod install

      - name: Build (no code signing)
        working-directory: app/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          echo "Workspace: $WS  Scheme: $SCHEME"
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -200

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/out/Payload"
          cp -R "$RUNNER_TEMP"/App.xcarchive/Products/Applications/*.app "$RUNNER_TEMP/out/Payload/"
          cd "$RUNNER_TEMP/out" && zip -qry ReadAlong.ipa Payload
          ls -la "$RUNNER_TEMP/out/ReadAlong.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ReadAlong-ipa
          path: ${{ runner.temp }}/out/ReadAlong.ipa

      - name: Publish as release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Read Along build ${{ github.run_number }}
          body: "Unsigned IPA. Install with Sideloadly using your Apple ID."
          files: ${{ runner.temp }}/out/ReadAlong.ipa
          make_latest: true
